<!DOCTYPE html>
<html>
<head>
    <title>MoonWar 3D</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a2e; overflow: hidden; font-family: Arial, sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        #top-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; border: 1px solid #4a4a6a; }
        #turn-text { font-size: 20px; font-weight: bold; color: #00aaff; }
        #energy-text { font-size: 18px; margin-top: 5px; color: #ffaa00; }

        #bottom-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
            background: rgba(10, 10, 25, 0.95); border-top: 2px solid #4a4a6a;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box;
        }

        #energy-wheel-container { display: flex; flex-direction: column; align-items: center; width: 150px; }
        #spin-btn {
            background: #ffaa00; color: black; font-weight: bold; font-size: 18px;
            padding: 15px; border-radius: 50%; width: 80px; height: 80px; border: 3px solid #fff; cursor: pointer; transition: transform 0.1s;
        }
        #spin-btn:active { transform: scale(0.95); }
        #spin-btn:disabled { background: #555; cursor: not-allowed; border-color: #333; }

        #modules-container { display: flex; gap: 20px; flex-grow: 1; justify-content: center; }
        .tab-group { display: flex; flex-direction: column; background: #222; border: 1px solid #4a4a6a; border-radius: 8px; }
        .tab-header { background: #4a4a6a; text-align: center; padding: 5px; font-size: 14px; font-weight: bold; }
        .tab-items { display: flex; padding: 10px; gap: 10px; }
        .module-btn {
            background: #333; color: white; border: 1px solid #666; padding: 10px;
            border-radius: 5px; cursor: pointer; width: 90px; text-align: center; font-size: 12px;
        }
        .module-btn:hover { background: #555; }
        .module-btn.selected { border-color: #00ff00; background: #2a4a2a; }

        #end-turn-btn { background: #aa0000; color: white; font-weight: bold; font-size: 16px; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; margin-right: 20px; }

        #ui-panel {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 10px 20px; border-radius: 10px;
            display: none; text-align: center; border: 2px solid #4a4a6a;
        }
        #ui-panel button { background: #4a4a6a; color: white; border: none; padding: 5px 15px; font-size: 16px; cursor: pointer; margin: 0 5px; border-radius: 5px; }
        #power-bar-container { width: 200px; height: 15px; background: #333; border: 1px solid #fff; margin: 10px auto; }
        #power-bar { width: 0%; height: 100%; background: #ffaa00; }
        #fire-btn { background: #aa00aa !important; font-weight: bold; width: 100%; margin-top: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="top-info">
        <div id="turn-text">Ход: Игрок 1</div>
        <div id="energy-text">Энергия: 0</div>
    </div>

    <div id="ui-panel">
        <div>
            <button id="turn-left">◀</button>
            <span style="font-size: 14px; margin: 0 10px;">Направление</span>
            <button id="turn-right">▶</button>
        </div>
        <div id="power-bar-container"><div id="power-bar"></div></div>
        <button id="fire-btn">ЗАЖМИ ДЛЯ ВЫСТРЕЛА</button>
    </div>

    <div id="bottom-panel">
        <div id="energy-wheel-container">
            <button id="spin-btn">КРУТИТЬ</button>
        </div>

        <div id="modules-container">
            <div class="tab-group">
                <div class="tab-header">1 Энергия</div>
                <div class="tab-items">
                    <button class="module-btn" data-type="bomb">Бомба</button>
                    <button class="module-btn" data-type="heal">Лечилка</button>
                    <button class="module-btn" data-type="drone">Разведчик</button>
                </div>
            </div>
            <div class="tab-group">
                <div class="tab-header">3 Энергии</div>
                <div class="tab-items">
                    <button class="module-btn" data-type="aao">ПВО</button>
                    <button class="module-btn" data-type="homing">Ракета</button>
                </div>
            </div>
            <div class="tab-group">
                <div class="tab-header">7 Энергии</div>
                <div class="tab-items">
                    <button class="module-btn" data-type="relay">База-реле</button>
                    <button class="module-btn" data-type="dome">Купол</button>
                    <button class="module-btn" data-type="generator">Генератор</button>
                </div>
            </div>
        </div>

        <button id="end-turn-btn">КОНЕЦ ХОДА</button>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
</body>
</html>
