<!DOCTYPE html>
<html>
<head>
    <title>MoonWar 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #050510; overflow: hidden; font-family: 'Orbitron', Arial, sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        #top-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; border: 1px solid #4a4a6a; z-index: 10; }
        #turn-text { font-size: 20px; font-weight: bold; color: #00aaff; text-shadow: 0 0 10px #00aaff; }
        #energy-text { font-size: 18px; margin-top: 5px; color: #00aaff; text-shadow: 0 0 10px #00aaff; }

        #bottom-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
            background: rgba(10, 10, 25, 0.95); border-top: 2px solid #4a4a6a;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box;
            z-index: 10; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        #energy-wheel-container { display: flex; align-items: center; gap: 15px; }
        
        #spin-btn {
            background: #1a1a2e; color: #00aaff; font-weight: 900; font-size: 32px;
            padding: 15px; border-radius: 50%; width: 80px; height: 80px; border: 2px solid #00aaff; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-family: 'Orbitron', sans-serif;
            transition: all 0.2s;
        }
        #spin-btn.pulse { animation: pulse-blue 2s infinite; }
        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(0, 170, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 170, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 170, 255, 0); }
        }
        #spin-btn:hover:not(:disabled) { background: rgba(0, 170, 255, 0.2); }
        #spin-btn:disabled { background: #222; cursor: not-allowed; border-color: #444; color: #555; animation: none; box-shadow: none; }

        .camera-controls { display: flex; gap: 10px; margin-left: 10px; }
        .camera-controls button {
            background: #1a1a2e; color: #00aaff; border: 1px solid #00aaff; 
            padding: 15px 0; width: 55px; text-align: center; 
            border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; font-family: 'Orbitron', sans-serif;
            transition: all 0.2s; box-sizing: border-box;
        }
        .camera-controls button:hover { background: rgba(0, 170, 255, 0.2); box-shadow: 0 0 15px #00aaff; }

        #modules-container { display: flex; gap: 20px; flex-grow: 1; justify-content: center; }
        .tab-group { display: flex; flex-direction: column; background: #111; border: 1px solid #4a4a6a; border-radius: 8px; overflow: hidden; }
        .tab-header { background: #2a2a4a; text-align: center; padding: 5px; font-size: 12px; font-weight: bold; color: #aaa; }
        .tab-items { display: flex; padding: 10px; gap: 10px; }
        .module-btn {
            background: #1a1a2e; color: white; border: 1px solid #4a4a6a; padding: 10px;
            border-radius: 5px; cursor: pointer; width: 90px; text-align: center; font-size: 12px; font-family: 'Orbitron', sans-serif;
            transition: all 0.2s;
        }
        .module-btn:hover { background: #2a2a4a; border-color: #00aaff; }
        .module-btn.selected { border-color: #00aaff; background: rgba(0, 170, 255, 0.2); color: #fff; box-shadow: 0 0 10px rgba(0,170,255,0.3); }

        #end-turn-btn { 
            background: transparent; color: #00aaff; font-weight: bold; font-size: 16px; padding: 15px 30px; 
            border: 2px solid #00aaff; border-radius: 8px; cursor: pointer; margin-right: 20px; font-family: 'Orbitron', sans-serif;
            transition: all 0.2s;
        }
        #end-turn-btn:hover { background: rgba(0, 170, 255, 0.2); box-shadow: 0 0 20px rgba(0, 170, 255, 0.5); }

        #ui-panel {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 25, 0.95); padding: 15px 30px; border-radius: 10px;
            display: none; text-align: center; border: 2px solid #4a4a6a; box-shadow: 0 0 20px rgba(0, 170, 255, 0.1);
            z-index: 10;
        }
        #ui-panel button { 
            background: #1a1a2e; color: white; border: 1px solid #00aaff; padding: 8px 15px; font-size: 16px; 
            cursor: pointer; margin: 0 5px; border-radius: 5px; font-family: 'Orbitron', sans-serif; transition: all 0.2s;
        }
        #ui-panel button:hover { background: rgba(0, 170, 255, 0.2); }

        #power-bar-container { width: 200px; height: 15px; background: #111; border: 1px solid #00aaff; margin: 10px auto; border-radius: 10px; overflow: hidden; }
        #power-bar { width: 0%; height: 100%; background: #00aaff; box-shadow: 0 0 10px #00aaff; }
        
        #fire-btn { background: rgba(0, 170, 255, 0.2) !important; font-weight: bold; width: 100%; margin-top: 10px; border-color: #00aaff !important; color: #fff; }
        #fire-btn:hover { background: #00aaff !important; color: black; box-shadow: 0 0 20px #00aaff; }

        /* --- ЭКРАН ОЖИДАНИЯ (Убран blur) --- */
        #waiting-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); 
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 500; pointer-events: none;
        }
        .waiting-text {
            font-size: 36px; font-weight: 900; color: #00aaff; letter-spacing: 5px;
            text-shadow: 0 0 20px #00aaff; animation: pulse-text 1.5s infinite;
        }
        @keyframes pulse-text {
            0% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 30px #00aaff; }
            100% { opacity: 0.5; }
        }

        /* --- СТИЛИ СТАРТОВОГО ЭКРАНА --- */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #050510;
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #050510 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; overflow: hidden;
        }

        #start-screen::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="30" r="1" fill="%23ffffff" opacity="0.4"/><circle cx="40" cy="70" r="1" fill="%23ffffff" opacity="0.4"/><circle cx="50" cy="160" r="1" fill="%23ffffff" opacity="0.4"/><circle cx="90" cy="40" r="1.5" fill="%23ffffff" opacity="0.5"/><circle cx="130" cy="80" r="1" fill="%23ffffff" opacity="0.4"/><circle cx="150" cy="180" r="1.5" fill="%23ffffff" opacity="0.5"/><circle cx="10" cy="100" r="1" fill="%23ffffff" opacity="0.4"/><circle cx="180" cy="20" r="1" fill="%23ffffff" opacity="0.4"/></svg>');
            background-repeat: repeat; background-size: 200px 200px;
            opacity: 0.8;
        }

        .menu-card {
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(0, 170, 255, 0.3);
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.1), inset 0 0 20px rgba(0, 170, 255, 0.05);
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .menu-card h1 {
            font-size: 56px; margin: 0 0 10px 0; font-weight: 900; letter-spacing: 5px;
            background: linear-gradient(180deg, #fff, #00aaff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
        }

        .menu-card p {
            color: #88aaff; font-size: 16px; letter-spacing: 2px; margin-bottom: 30px;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .settings-row {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; gap: 30px;
        }

        .ai-label {
            color: #88aaff;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 170, 255, 0.5);
            white-space: nowrap;
        }

        .styled-select {
            background: #1a1a2e;
            color: #00aaff;
            border: 2px solid #00aaff;
            padding: 8px 35px 8px 15px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2300aaff" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position-x: 100%;
            background-position-y: 50%;
            transition: all 0.2s;
        }
        .styled-select:hover { background-color: #2a2a4a; box-shadow: 0 0 15px rgba(0, 170, 255, 0.4); }
        .styled-select option { background: #1a1a2e; color: white; }

        .ai-selector { display: flex; align-items: center; gap: 15px; }
        .ai-btn {
            background: transparent; color: #00aaff; border: 2px solid #00aaff; 
            width: 35px; height: 35px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: all 0.2s; font-family: 'Orbitron', sans-serif;
        }
        .ai-btn:hover { background: rgba(0, 170, 255, 0.2); box-shadow: 0 0 15px #00aaff; }

        #ai-count {
            font-size: 28px; font-weight: bold; color: white; text-align: center;
            background: transparent; border: none; width: 50px; font-family: 'Orbitron', sans-serif;
            border-bottom: 2px solid #4a4a6a; padding-bottom: 5px;
        }
        #ai-count:focus { outline: none; border-bottom-color: #00aaff; }
        #ai-count::-webkit-outer-spin-button, #ai-count::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        #ai-count[type=number] { -moz-appearance: textfield; }

        #start-btn {
            background: transparent; color: #fff; font-size: 22px; font-weight: bold; letter-spacing: 3px;
            padding: 18px 50px; border: 2px solid #00aaff; border-radius: 50px; cursor: pointer;
            position: relative; overflow: hidden; transition: all 0.3s; font-family: 'Orbitron', sans-serif;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.2);
        }
        #start-btn:hover { background: #00aaff; color: #000; box-shadow: 0 0 40px #00aaff; transform: scale(1.05); }
        #start-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s;
        }
        #start-btn:hover::before { left: 100%; }

        #custom-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; transition: opacity 0.3s ease;
        }
        #custom-modal-overlay.active { display: flex; opacity: 1; }
        .custom-modal-box {
            background: rgba(20, 20, 40, 0.95);
            border: 2px solid #00aaff; border-radius: 15px;
            padding: 30px 50px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.4), inset 0 0 15px rgba(0, 170, 255, 0.1);
            transform: translateY(20px); transition: transform 0.3s ease;
            max-width: 80%; min-width: 300px;
        }
        #custom-modal-overlay.active .custom-modal-box { transform: translateY(0); }
        #custom-modal-title {
            color: #00aaff; font-size: 24px; font-weight: 900; letter-spacing: 2px;
            margin-bottom: 15px; text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
        }
        #custom-modal-text {
            color: #fff; font-size: 16px; margin-bottom: 25px; line-height: 1.5;
        }
        #custom-modal-btn {
            background: transparent; color: #00aaff; border: 2px solid #00aaff;
            padding: 10px 30px; border-radius: 8px; font-family: 'Orbitron', sans-serif;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        #custom-modal-btn:hover {
            background: #00aaff; color: #000; box-shadow: 0 0 20px #00aaff;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="start-screen">
        <div class="menu-card">
            <h1>MOONWAR 3D</h1>
            <p>КОСМИЧЕСКАЯ ТАКТИЧЕСКАЯ СТРАТЕГИЯ</p>
            
            <div class="settings-group">
                <div class="settings-row">
                    <div class="ai-label">Планета:</div>
                    <select id="planet-size" class="styled-select" onchange="updateMaxPlayers()">
                        <option value="1">Маленькая</option>
                        <option value="2">Средняя</option>
                        <option value="4">Большая</option>
                    </select>
                </div>

                <div class="settings-row">
                    <div class="ai-label">Игроков (ИИ):</div>
                    <div class="ai-selector">
                        <button class="ai-btn" onclick="changeAI(-1)">-</button>
                        <input type="number" id="ai-count" value="1" min="1" max="11" readonly>
                        <button class="ai-btn" onclick="changeAI(1)">+</button>
                    </div>
                </div>

                <div class="settings-row">
                    <div class="ai-label">Скорость ИИ:</div>
                    <select id="ai-speed" class="styled-select">
                        <option value="1">Обычная</option>
                        <option value="2">Быстрая x2</option>
                        <option value="5">Очень быстрая x5</option>
                        <option value="100">Мгновенная</option>
                    </select>
                </div>
            </div>
            
            <button id="start-btn">НАЧАТЬ ИГРУ</button>
        </div>
    </div>

    <div id="waiting-screen">
        <div class="waiting-text">ОЖИДАНИЕ ХОДА...</div>
    </div>

    <div id="top-info">
        <div id="turn-text">Ход: Игрок 1</div>
        <div id="energy-text">Энергия: 0</div>
    </div>

    <div id="ui-panel">
        <div>
            <button id="turn-left">◀</button>
            <span style="font-size: 14px; margin: 0 10px; color: #aaa;">НАПРАВЛЕНИЕ</span>
            <button id="turn-right">▶</button>
        </div>
        <div id="power-bar-container"><div id="power-bar"></div></div>
        <button id="fire-btn">ЗАЖМИ ДЛЯ ВЫСТРЕЛА</button>
    </div>

    <div id="bottom-panel">
        <div id="energy-wheel-container">
            <button id="spin-btn" class="pulse">⚡</button>
            <div class="camera-controls">
                <button id="cycle-prev" title="Предыдущая база (W)">W</button>
                <button id="cycle-next" title="Следующая база (S)">S</button>
                <button id="rotate-left" title="Повернуть камеру влево (A)">A</button>
                <button id="rotate-right" title="Повернуть камеру вправо (D)">D</button>
            </div>
        </div>

        <div id="modules-container">
            <div class="tab-group">
                <div class="tab-header">1 ЭНЕРГИЯ</div>
                <div class="tab-items">
                    <button class="module-btn" data-type="bomb">БОМБА</button>
                    <button class="module-btn" data-type="heal">РЕМОНТ</button>
                    <button class="module-btn" data-type="drone">РАДАР</button>
                </div>
            </div>
            <div class="tab-group">
                <div class="tab-header">3 ЭНЕРГИИ</div>
                <div class="tab-items">
                    <button class="module-btn" data-type="aao">ПВО</button>
                    <button class="module-btn" data-type="homing">РАКЕТА</button>
                </div>
            </div>
            <div class="tab-group">
                <div class="tab-header">7 ЭНЕРГИИ</div>
                <div class="tab-items">
                    <button class="module-btn" data-type="relay">БАЗА</button>
                    <button class="module-btn" data-type="dome">КУПОЛ</button>
                    <button class="module-btn" data-type="generator">ГЕНЕРАТОР</button>
                </div>
            </div>
        </div>

        <button id="end-turn-btn">КОНЕЦ ХОДА</button>
    </div>

    <div id="custom-modal-overlay">
        <div class="custom-modal-box">
            <div id="custom-modal-title">УВЕДОМЛЕНИЕ</div>
            <div id="custom-modal-text">Текст сообщения</div>
            <button id="custom-modal-btn" onclick="closeModal()">ОК</button>
        </div>
    </div>

    <script>
        let maxPlayersLimit = 11;

        function updateMaxPlayers() {
            const size = parseInt(document.getElementById('planet-size').value);
            if (size === 1) maxPlayersLimit = 11;
            if (size === 2) maxPlayersLimit = 23;
            if (size === 4) maxPlayersLimit = 47;
            
            const input = document.getElementById('ai-count');
            if (parseInt(input.value) > maxPlayersLimit) input.value = maxPlayersLimit;
            input.max = maxPlayersLimit;
        }

        function changeAI(amount) {
            const input = document.getElementById('ai-count');
            let val = parseInt(input.value) + amount;
            if (val < 1) val = 1;
            if (val > maxPlayersLimit) val = maxPlayersLimit;
            input.value = val;
        }

        window.showMessage = function(title, text) {
            const overlay = document.getElementById('custom-modal-overlay');
            document.getElementById('custom-modal-title').innerText = title;
            document.getElementById('custom-modal-text').innerText = text;
            overlay.classList.add('active');
        };

        window.closeModal = function() {
            const overlay = document.getElementById('custom-modal-overlay');
            overlay.classList.remove('active');
        };
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
